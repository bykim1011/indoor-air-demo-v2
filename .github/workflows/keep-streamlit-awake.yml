name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit health endpoint
        run: |
          curl --fail \
               --max-time 60 \
               --retry 3 \
               --user-agent "Mozilla/5.0" \
               "https://indoor-air-demo-v2.streamlit.app/_stcore/health"
